; ULT Freezer Monitoring Node
; One fleet image for all 21 freezers. Prototype 22 has its own build profile
; and is not counted as a freezer.

[env:esp32-s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; ota_0 / ota_1 + a ~1.4 MB LittleFS partition. The FS partition is the
; offline reading buffer; two app partitions are what make ArduinoOTA work.
; Most ESP32-S3 Supermini boards ship 4 MB. default.csv fits that exactly and
; still works on an 8 MB part, so it is the safe single-image choice.
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.filesystem = littlefs

; The checked-in defaults enable bootloader app rollback. Keep the generated
; sdkconfig.<env> files out of Git; the defaults are merged on clean builds.
board_build.cmake_extra_args =
	-DSDKCONFIG_DEFAULTS=sdkconfig.defaults

monitor_speed = 115200
upload_speed = 921600

build_flags =
	; Serial over the S3's native USB-CDC (Supermini has no USB-UART bridge)
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=1

lib_deps =
	adafruit/Adafruit MAX31865 library@1.6.2
	tzapu/WiFiManager@2.0.17
	bblanchon/ArduinoJson@7.4.3

; Host-side unit tests for hardware-independent policy code.
[env:native]
platform = native
test_framework = unity
; Only this Arduino-independent production unit belongs in the native build;
; main.cpp requires the ESP32/Arduino framework and is covered by the
; esp32-s3/prototype-22 compile targets instead.
build_src_filter = +<post_policy.cpp>
test_build_src = yes

; Bench prototype only. Credentials live in an ignored local header and are
; compiled into this image, never into the 21-freezer fleet image.
[env:prototype-22]
extends = env:esp32-s3
build_flags =
	${env:esp32-s3.build_flags}
	-DPROTOTYPE_22

; --- Over-the-air upload -----------------------------------------------------
; Once a node is provisioned and on the network, copy this env, set the node's
; IP or mDNS name, and `pio run -e esp32-s3-ota -t upload`.
[env:esp32-s3-ota]
extends = env:esp32-s3
upload_protocol = espota
; Always supply --upload-port explicitly. A hard-coded freezer target is too
; easy to mistake for the node being updated.
